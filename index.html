<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div>
            <h1 id="title">Cadastre.se</h1>
            <hr>

            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Seu nome ou apelido" required size="12"/>

            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="Aquele que você mais usa" size="12"/>

            <label for="password">Senha</label>
            <input type="text" id="password" name="password" placeholder="Cuidado, é segredo!" required minlength="6" size="12"/>

            <button type="submit">Cadastrar</button>
            
        </div>
    </main>
</body>
</html>
